<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A month-long family gathering at Network School in Astana, Kazakhstan. June 2027."
    />
    <title>Familystan June 2027</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #fff;
        color: #000;
        font-family: Arial, Helvetica, sans-serif;
      }

      main {
        max-width: 52rem;
        padding: 5rem 4rem;
      }

      h1 {
        margin: 0;
        font-size: 48px;
        font-weight: 400;
        line-height: 1.2;
        color: #000;
      }

      p {
        margin: 0.75rem 0 0;
        font-size: 1rem;
        font-weight: 400;
        line-height: 1.5;
        color: #5f6368;
      }

      p.about {
        margin: 1.5rem 0 0;
        max-width: 640px;
        font-size: 18px;
        line-height: 1.5;
        color: #3c4043;
      }

      a {
        color: #1a73e8;
        text-decoration: underline;
      }

      @media (max-width: 600px) {
        main {
          padding: 3rem 1.5rem;
        }

        h1 {
          font-size: 2rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Familystan June 2027</h1>
      <p>
        A month-long family gathering at
        <a href="https://ns.com">Network School</a> in Astana, Kazakhstan
      </p>
      <p class="about">
        This is a family world-schooling and co-living gathering at
        Network School, where families spend the month together. The
        focus is on school-age children, and families with younger kids
        are welcome too.
      </p>
    </main>
  </body>
</html>
